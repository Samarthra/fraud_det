[project]
name = "fraudlens"
version = "0.1.0"
requires-python = "==3.13.*"
dependencies = [
    "fastapi",
    "uvicorn",
    "python-multipart",
    "pyyaml",
    "openpyxl",
    "networkx",
    "langgraph==1.2.19",
    "langchain==1.4.7",
    "langchain-core==1.7.3",
    "langchain-openai==1.7.3",
    "openai==2.54.0",
    "langfuse==5.1.0",
    "pydantic==2.14.2",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = [
    "pytest",
    "httpx",
    "clingo>=5.8.2",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["app", "tests"]
testpaths = ["tests"]
